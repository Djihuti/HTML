server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Textformate komprimiert ausliefern
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite haengt einen Content-Hash an alle Dateien unter /assets -
    # sie duerfen daher unbegrenzt gecacht werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nie cachen, damit ein neues Deployment sofort sichtbar ist.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
